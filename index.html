<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slither PRO - Mapa Infinito</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0e15;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            display: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        #leaderboard {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #fff;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            display: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            min-width: 180px;
        }
        #leaderboard h3 {
            color: #00f2fe;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            text-align: center;
        }
        #leaderboard ol {
            padding-left: 18px;
            font-size: 12px;
        }
        #leaderboard li {
            margin-bottom: 4px;
            color: #e2e8f0;
        }
        #menuModal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 14, 21, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .card {
            background: #181b29;
            padding: 25px 30px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .card h1 {
            color: #00f2fe;
            margin-bottom: 4px;
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .card p {
            color: #a0aec0;
            font-size: 13px;
            margin-bottom: 16px;
        }
        .form-group {
            margin-bottom: 14px;
            text-align: left;
        }
        .form-group label {
            display: block;
            color: #e2e8f0;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .name-input, .select-input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: #0d0e15;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .name-input:focus, .select-input:focus {
            border-color: #00f2fe;
        }
        .color-options {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 6px;
        }
        .color-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .color-btn:hover {
            transform: scale(1.15);
        }
        .color-btn.selected {
            border-color: #ffffff;
            transform: scale(1.15);
        }
        .start-btn {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #fff;
            border: none;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: opacity 0.2s, transform 0.2s;
        }
        .start-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div id="hud">Bolinhas Comidas: <span id="score">0</span></div>

    <div id="leaderboard">
        <h3>Top Cobrinhas</h3>
        <ol id="leaderList"></ol>
    </div>

    <!-- Menu Principal com Novas Configurações -->
    <div id="menuModal">
        <div class="card">
            <h1>Slither PRO</h1>
            <p>Configure sua partida e comece a jogar:</p>
            
            <div class="form-group">
                <label for="playerName">Seu Nickname</label>
                <input type="text" id="playerName" class="name-input" placeholder="Digite seu nome" maxlength="12" value="Jogador">
            </div>

            <div class="form-group">
                <label for="botCount">Quantidade de Bots</label>
                <select id="botCount" class="select-input">
                    <option value="5">5 Bots</option>
                    <option value="12" selected>12 Bots</option>
                    <option value="20">20 Bots</option>
                    <option value="35">35 Bots (Caos)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="difficulty">Dificuldade dos Bots</label>
                <select id="difficulty" class="select-input">
                    <option value="easy">Fácil (Lentos e Inofensivos)</option>
                    <option value="medium" selected>Médio (Normal)</option>
                    <option value="hard">Difícil (Rápidos e Atentos)</option>
                    <option value="insane">Hard (Agressivos e Implacáveis)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Sua Cor</label>
                <div class="color-options" id="colorContainer"></div>
            </div>

            <button class="start-btn" onclick="startGame()">JOGAR AGORA</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const hud = document.getElementById('hud');
        const scoreElement = document.getElementById('score');
        const leaderboard = document.getElementById('leaderboard');
        const leaderList = document.getElementById('leaderList');
        const menuModal = document.getElementById('menuModal');
        const nameInput = document.getElementById('playerName');
        const botCountInput = document.getElementById('botCount');
        const difficultyInput = document.getElementById('difficulty');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const COLORS = [
            { head: '#00ff88', body: '#00b359' },
            { head: '#00d2ff', body: '#0072ff' },
            { head: '#ff007f', body: '#99004d' },
            { head: '#ff9900', body: '#cc6600' },
            { head: '#e60000', body: '#800000' }
        ];

        const BOT_NAMES = ['Alpha', 'Viper', 'Shadow', 'Slayer', 'Phantom', 'Python', 'Titan', 'Apex', 'Storm', 'Blaze', 'Ghost', 'Cobalt', 'Raptor', 'Omega', 'Hydra', 'Kraken', 'Ares', 'Zeus', 'Venom', 'Spectre', 'NEX', 'Kratos', 'Aura', 'Nova', 'Pulse', 'Cyber', 'Vortex', 'Saber', 'Fury', 'Havoc', 'Rogue', 'Hunter', 'Draco', 'Reaper', 'Mamba'];

        const DIFFICULTY_SETTINGS = {
            easy: { speed: 2.5, turnRate: 0.05, visionRadius: 80 },
            medium: { speed: 3.5, turnRate: 0.1, visionRadius: 160 },
            hard: { speed: 4.2, turnRate: 0.2, visionRadius: 260 },
            insane: { speed: 5.0, turnRate: 0.35, visionRadius: 380 }
        };

        let selectedColorIndex = 0;
        let isGameRunning = false;
        let currentDifficulty = 'medium';

        const colorContainer = document.getElementById('colorContainer');
        COLORS.forEach((col, index) => {
            const btn = document.createElement('div');
            btn.className = `color-btn ${index === 0 ? 'selected' : ''}`;
            btn.style.background = col.head;
            btn.onclick = () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedColorIndex = index;
            };
            colorContainer.appendChild(btn);
        });

        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;
        let controlMode = 'mouse';

        window.addEventListener('mousedown', () => { controlMode = 'mouse'; });
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        const keys = {};
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd'].includes(key)) {
                e.preventDefault();
                keys[key] = true;
                controlMode = 'keyboard';
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd'].includes(key)) {
                keys[key] = false;
            }
        });

        class Food {
            constructor(x, y, value = 1) {
                this.x = x !== undefined ? x : (Math.random() - 0.5) * 6000;
                this.y = y !== undefined ? y : (Math.random() - 0.5) * 6000;
                this.radius = value > 1 ? Math.random() * 3 + 6 : Math.random() * 3 + 3;
                this.value = value;
                this.color = value > 1 ? '#00ffff' : `hsl(${Math.random() * 360}, 80%, 60%)`;
            }

            draw(cameraX, cameraY) {
                ctx.beginPath();
                ctx.arc(this.x - cameraX, this.y - cameraY, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = this.value > 1 ? 10 : 0;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.closePath();
            }
        }

        class Snake {
            constructor(name, isBot = false, colors = COLORS[0]) {
                this.name = name;
                this.isBot = isBot;
                this.colors = colors;
                this.reset();
            }

            reset() {
                this.x = (Math.random() - 0.5) * 4000;
                this.y = (Math.random() - 0.5) * 4000;
                this.radius = 12;
                
                const settings = DIFFICULTY_SETTINGS[currentDifficulty];
                this.speed = this.isBot ? settings.speed : 3.8;
                
                this.angle = Math.random() * Math.PI * 2;
                this.body = [];
                this.length = 25;
                this.eatenCount = 0;
                this.dead = false;

                for (let i = 0; i < this.length; i++) {
                    this.body.push({ x: this.x, y: this.y });
                }
            }

            update(allSnakes) {
                if (this.dead) return;

                if (!this.isBot) {
                    if (controlMode === 'keyboard') {
                        let dx = 0, dy = 0;
                        if (keys['arrowup'] || keys['w']) dy -= 1;
                        if (keys['arrowdown'] || keys['s']) dy += 1;
                        if (keys['arrowleft'] || keys['a']) dx -= 1;
                        if (keys['arrowright'] || keys['d']) dx += 1;

                        if (dx !== 0 || dy !== 0) {
                            this.angle = Math.atan2(dy, dx);
                        }
                    } else {
                        this.angle = Math.atan2(mouseY - canvas.height / 2, mouseX - canvas.width / 2);
                    }
                } else {
                    // IA do Bot ajustada pela dificuldade
                    const settings = DIFFICULTY_SETTINGS[currentDifficulty];
                    let avoidAngle = null;

                    // Desviar de outras cobras
                    for (let other of allSnakes) {
                        if (other === this || other.dead) continue;
                        for (let seg of other.body) {
                            const dist = Math.hypot(this.x - seg.x, this.y - seg.y);
                            if (dist < settings.visionRadius) {
                                avoidAngle = Math.atan2(this.y - seg.y, this.x - seg.x);
                                break;
                            }
                        }
                        if (avoidAngle !== null) break;
                    }

                    if (avoidAngle !== null) {
                        this.angle += (avoidAngle - this.angle) * settings.turnRate;
                    } else if (Math.random() < 0.03) {
                        this.angle += (Math.random() - 0.5) * 1.2;
                    }
                }

                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                this.body.unshift({ x: this.x, y: this.y });

                while (this.body.length > this.length) {
                    this.body.pop();
                }
            }

            draw(cameraX, cameraY) {
                if (this.dead) return;

                for (let i = this.body.length - 1; i >= 0; i--) {
                    const segment = this.body[i];
                    ctx.beginPath();
                    ctx.arc(segment.x - cameraX, segment.y - cameraY, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = i === 0 ? this.colors.head : this.colors.body;
                    ctx.fill();
                    ctx.closePath();
                }

                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.font = '600 11px Segoe UI';
                ctx.textAlign = 'center';
                ctx.fillText(this.name, this.x - cameraX, this.y - cameraY - this.radius - 5);
            }

            grow(amount = 1) {
                this.eatenCount += amount;
                this.length += amount * 3;
                this.radius = Math.min(12 + Math.floor(this.length / 80), 26);
            }

            die() {
                this.dead = true;
                for (let i = 0; i < this.body.length; i += 2) {
                    foods.push(new Food(
                        this.body[i].x + (Math.random() - 0.5) * 20,
                        this.body[i].y + (Math.random() - 0.5) * 20,
                        2
                    ));
                }

                if (this.isBot) {
                    setTimeout(() => {
                        this.colors = COLORS[Math.floor(Math.random() * COLORS.length)];
                        this.reset();
                    }, 3000);
                } else {
                    gameOver();
                }
            }
        }

        let player;
        let bots = [];
        let foods = [];

        function startGame() {
            currentDifficulty = difficultyInput.value;
            const botQuantity = parseInt(botCountInput.value, 10);

            menuModal.style.display = 'none';
            hud.style.display = 'block';
            leaderboard.style.display = 'block';

            const name = nameInput.value.trim() || 'Jogador';

            player = new Snake(name, false, COLORS[selectedColorIndex]);
            scoreElement.innerText = player.eatenCount;

            // Criar a quantidade selecionada de bots
            bots = [];
            for (let i = 0; i < botQuantity; i++) {
                const bName = BOT_NAMES[i % BOT_NAMES.length] + (i >= BOT_NAMES.length ? `_${i}` : '');
                bots.push(new Snake(bName, true, COLORS[Math.floor(Math.random() * COLORS.length)]));
            }

            foods = Array.from({ length: 350 + botQuantity * 10 }, () => new Food());

            isGameRunning = true;
        }

        function gameOver() {
            isGameRunning = false;
            hud.style.display = 'none';
            leaderboard.style.display = 'none';
            menuModal.style.display = 'flex';
            alert(`Fim de jogo! ${player.name}, você comeu ${player.eatenCount} bolinhas!`);
        }

        function updateLeaderboard(allSnakes) {
            const sorted = [...allSnakes].sort((a, b) => b.eatenCount - a.eatenCount).slice(0, 5);

            leaderList.innerHTML = '';
            sorted.forEach(snake => {
                const li = document.createElement('li');
                li.innerText = `${snake.name}: ${snake.eatenCount}`;
                if (snake === player) li.style.color = '#00f2fe';
                leaderList.appendChild(li);
            });
        }

        function drawGrid(cameraX, cameraY) {
            const gridSize = 120;
            const startX = -cameraX % gridSize;
            const startY = -cameraY % gridSize;

            ctx.strokeStyle = '#181b29';
            ctx.lineWidth = 1;

            for (let x = startX; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            for (let y = startY; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isGameRunning && player) {
                const cameraX = player.x - canvas.width / 2;
                const cameraY = player.y - canvas.height / 2;

                drawGrid(cameraX, cameraY);

                const allSnakes = [player, ...bots];

                foods.forEach((food, index) => {
                    food.draw(cameraX, cameraY);

                    const distP = Math.hypot(player.x - food.x, player.y - food.y);
                    if (distP < player.radius + food.radius) {
                        player.grow(food.value);
                        scoreElement.innerText = player.eatenCount;
                        foods.splice(index, 1);
                        foods.push(new Food());
                    }

                    bots.forEach(bot => {
                        if (!bot.dead) {
                            const distB = Math.hypot(bot.x - food.x, bot.y - food.y);
                            if (distB < bot.radius + food.radius) {
                                bot.grow(food.value);
                                foods.splice(index, 1);
                                foods.push(new Food());
                            }
                        }
                    });
                });

                bots.forEach(bot => {
                    bot.update(allSnakes);
                    bot.draw(cameraX, cameraY);
                });

                player.update(allSnakes);
                player.draw(cameraX, cameraY);

                allSnakes.forEach(snakeA => {
                    if (snakeA.dead) return;

                    allSnakes.forEach(snakeB => {
                        if (snakeA === snakeB || snakeB.dead) return;

                        for (let i = 5; i < snakeB.body.length; i++) {
                            const seg = snakeB.body[i];
                            const dist = Math.hypot(snakeA.x - seg.x, snakeA.y - seg.y);

                            if (dist < snakeA.radius + snakeB.radius - 4) {
                                snakeA.die();
                                break;
                            }
                        }
                    });
                });

                updateLeaderboard(allSnakes);
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
